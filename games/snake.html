<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>终端贪吃蛇 · 学习资源库小游戏</title>
<meta name="description" content="终端黑客风格的贪吃蛇小游戏，键盘方向键或 WASD 操作，支持触屏滑动。">
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/png" href="../assets/images/brand-book-line.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --term-bg:#0a0f0d;
    --term-panel:#0f1714;
    --term-line:#1d2b25;
    --term-green:#34d399;
    --term-green-dim:#16654d;
    --term-amber:#fbbf24;
    --term-text:#a7f3d0;
    --term-muted:#5b7a6e;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:radial-gradient(circle at 50% 0%,#10201a 0%,var(--term-bg) 60%);
    color:var(--term-text);
    font-family:'Space Grotesk','Noto Sans SC',monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
  }
  .topbar { width:100%; max-width:520px; display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .topbar a { color:var(--term-muted); text-decoration:none; font-size:.85rem; }
  .topbar a:hover { color:var(--term-green); }
  .topbar .title { color:var(--term-green); font-weight:700; letter-spacing:1px; }
  .panel {
    width:100%; max-width:520px;
    background:var(--term-panel);
    border:1px solid var(--term-line);
    border-radius:14px;
    padding:18px;
    box-shadow:0 0 40px rgba(52,211,153,.06), inset 0 0 0 1px rgba(52,211,153,.04);
  }
  .hud { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .hud .stat { font-size:.85rem; color:var(--term-muted); }
  .hud .stat strong { color:var(--term-green); font-size:1.15rem; margin-left:6px; }
  .hud .stat .amber { color:var(--term-amber); }
  .stage { position:relative; }
  canvas {
    width:100%; display:block;
    background:#070b09;
    border:1px solid var(--term-green-dim);
    border-radius:10px;
    image-rendering:pixelated;
    touch-action:none;
  }
  .overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(7,11,9,.82);
    border-radius:10px;
    text-align:center;
    padding:20px;
    gap:14px;
  }
  .overlay.hidden { display:none; }
  .overlay h2 { color:var(--term-green); font-size:1.4rem; letter-spacing:1px; }
  .overlay p { color:var(--term-muted); font-size:.85rem; line-height:1.7; }
  .overlay .final { color:var(--term-amber); font-size:1rem; }
  .btn {
    background:transparent;
    color:var(--term-green);
    border:1px solid var(--term-green);
    border-radius:8px;
    padding:10px 22px;
    font-family:inherit;
    font-size:.9rem;
    font-weight:700;
    letter-spacing:1px;
    cursor:pointer;
    transition:.15s;
  }
  .btn:hover { background:var(--term-green); color:#04130d; box-shadow:0 0 18px rgba(52,211,153,.4); }
  .controls { margin-top:14px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn--sm { padding:7px 16px; font-size:.8rem; }
  .hint { margin-top:16px; font-size:.78rem; color:var(--term-muted); text-align:center; line-height:1.8; }
  .hint kbd {
    background:#0d1612; border:1px solid var(--term-line); border-radius:4px;
    padding:1px 7px; color:var(--term-green); font-family:inherit; font-size:.78rem;
  }
  .dpad { display:none; margin-top:16px; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px); gap:6px; justify-content:center; }
  .dpad button {
    background:var(--term-panel); border:1px solid var(--term-green-dim); border-radius:10px;
    color:var(--term-green); font-size:1.2rem; cursor:pointer;
  }
  .dpad button:active { background:var(--term-green-dim); }
  .dpad .up { grid-column:2; grid-row:1; }
  .dpad .left { grid-column:1; grid-row:2; }
  .dpad .down { grid-column:2; grid-row:3; }
  .dpad .right { grid-column:3; grid-row:2; }
  @media (hover:none) and (pointer:coarse) { .dpad { display:grid; } }
</style>
</head>
<body>
  <div class="topbar">
    <a href="../games.html">← 游戏中心</a>
    <span class="title">TERMINAL.SNAKE</span>
    <a href="../index.html">回首页</a>
  </div>

  <div class="panel">
    <div class="hud">
      <div class="stat">SCORE<strong id="score">0</strong></div>
      <div class="stat">BEST<strong class="amber" id="best">0</strong></div>
      <div class="stat">LEVEL<strong id="level">1</strong></div>
    </div>
    <div class="stage">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">终端贪吃蛇</h2>
        <p id="ovText">吃掉数据包（绿色方块）增长，别撞墙、别咬到自己。<br>方向键 / WASD 控制，空格暂停。</p>
        <p class="final hidden" id="ovFinal"></p>
        <button class="btn" id="startBtn">开始游戏</button>
      </div>
    </div>
    <div class="controls">
      <button class="btn btn--sm" id="pauseBtn">暂停</button>
      <button class="btn btn--sm" id="restartBtn">重开</button>
    </div>
    <div class="dpad">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="down" data-dir="down">▼</button>
      <button class="right" data-dir="right">▶</button>
    </div>
    <p class="hint">
      键盘：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>，<kbd>空格</kbd> 暂停<br>
      手机：滑动屏幕或点方向键
    </p>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 20;
  const CELL = canvas.width / GRID;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovFinal = document.getElementById('ovFinal');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');

  let snake, dir, nextDir, food, score, level, speed, timer, state;
  let best = 0;
  try { best = parseInt(localStorage.getItem('terminal_snake_best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    level = 1;
    speed = 140;
    placeFood();
    updateHud();
  }

  function placeFood() {
    while (true) {
      const f = {x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID)};
      if (!snake.some(s => s.x===f.x && s.y===f.y)) { food = f; return; }
    }
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    bestEl.textContent = best;
  }

  function tick() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x<0 || head.x>=GRID || head.y<0 || head.y>=GRID ||
        snake.some(s => s.x===head.x && s.y===head.y)) {
      return gameOver();
    }
    snake.unshift(head);

    if (head.x===food.x && head.y===food.y) {
      score += 10;
      if (score % 50 === 0) {
        level++;
        speed = Math.max(60, speed - 14);
        restartTimer();
      }
      placeFood();
    } else {
      snake.pop();
    }
    updateHud();
    draw();
  }

  function draw() {
    ctx.fillStyle = '#070b09';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = 'rgba(52,211,153,0.05)';
    ctx.lineWidth = 1;
    for (let i=1;i<GRID;i++) {
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke();
    }

    ctx.fillStyle = '#fbbf24';
    const fx = food.x*CELL, fy = food.y*CELL;
    ctx.fillRect(fx+4, fy+4, CELL-8, CELL-8);

    for (let i=0;i<snake.length;i++) {
      const s = snake[i];
      if (i===0) {
        ctx.fillStyle = '#34d399';
        ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
        ctx.fillStyle = '#04130d';
        ctx.fillRect(s.x*CELL+5, s.y*CELL+6, 3, 3);
        ctx.fillRect(s.x*CELL+CELL-8, s.y*CELL+6, 3, 3);
      } else {
        ctx.fillStyle = i%2 ? '#16654d' : '#15803d';
        ctx.fillRect(s.x*CELL+2, s.y*CELL+2, CELL-4, CELL-4);
      }
    }
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function start() {
    reset();
    draw();
    state = 'running';
    overlay.classList.add('hidden');
    restartTimer();
  }

  function gameOver() {
    clearInterval(timer);
    state = 'over';
    if (score > best) {
      best = score;
      try { localStorage.setItem('terminal_snake_best', String(best)); } catch (e) {}
    }
    updateHud();
    ovTitle.textContent = '连接中断';
    ovText.innerHTML = '蛇撞到了边界或自身。';
    ovFinal.textContent = '本局得分 ' + score + ' · 最高 ' + best;
    ovFinal.classList.remove('hidden');
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (state === 'running') {
      clearInterval(timer);
      state = 'paused';
      pauseBtn.textContent = '继续';
      ovTitle.textContent = '已暂停';
      ovText.innerHTML = '按空格或点击继续。';
      ovFinal.classList.add('hidden');
      startBtn.textContent = '继续游戏';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      resume();
    }
  }

  function resume() {
    state = 'running';
    pauseBtn.textContent = '暂停';
    overlay.classList.add('hidden');
    restartTimer();
  }

  function setDir(name) {
    const map = {
      up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}
    };
    const d = map[name];
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  document.addEventListener('keydown', function(e) {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()) || e.key===' ') e.preventDefault();
    if (k==='arrowup'||k==='w') setDir('up');
    else if (k==='arrowdown'||k==='s') setDir('down');
    else if (k==='arrowleft'||k==='a') setDir('left');
    else if (k==='arrowright'||k==='d') setDir('right');
    else if (e.key===' ') {
      if (state==='running'||state==='paused') togglePause();
    }
  });

  document.querySelectorAll('.dpad button').forEach(b => {
    b.addEventListener('click', () => setDir(b.dataset.dir));
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', function(e) {
    touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY};
  }, {passive:true});
  canvas.addEventListener('touchend', function(e) {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx)<18 && Math.abs(dy)<18) return;
    if (Math.abs(dx)>Math.abs(dy)) setDir(dx>0?'right':'left');
    else setDir(dy>0?'down':'up');
    touchStart = null;
  }, {passive:true});

  startBtn.addEventListener('click', function() {
    if (state==='paused') resume();
    else start();
  });
  pauseBtn.addEventListener('click', function() {
    if (state==='running'||state==='paused') togglePause();
  });
  restartBtn.addEventListener('click', start);

  reset();
  draw();
})();
</script>
</body>
</html>
