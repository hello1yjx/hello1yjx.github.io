<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>终端贪吃蛇 · 学习资源库小游戏</title>
<meta name="description" content="终端黑客风格的贪吃蛇小游戏，键盘方向键或 WASD 操作，支持触屏滑动。">
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/png" href="../assets/images/brand-book-line.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --term-bg:#0a0f0d;
    --term-panel:#0f1714;
    --term-line:#1d2b25;
    --term-green:#34d399;
    --term-green-dim:#16654d;
    --term-amber:#fbbf24;
    --term-text:#a7f3d0;
    --term-muted:#5b7a6e;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:radial-gradient(circle at 50% 0%,#10201a 0%,var(--term-bg) 60%);
    color:var(--term-text);
    font-family:'Space Grotesk','Noto Sans SC',monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
  }
  .topbar { width:100%; max-width:520px; display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .topbar a { color:var(--term-muted); text-decoration:none; font-size:.85rem; }
  .topbar a:hover { color:var(--term-green); }
  .topbar .title { color:var(--term-green); font-weight:700; letter-spacing:1px; }
  .panel {
    width:100%; max-width:520px;
    background:var(--term-panel);
    border:1px solid var(--term-line);
    border-radius:14px;
    padding:18px;
    box-shadow:0 0 40px rgba(52,211,153,.06), inset 0 0 0 1px rgba(52,211,153,.04);
  }
  .hud { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .hud .stat { font-size:.85rem; color:var(--term-muted); }
  .hud .stat strong { color:var(--term-green); font-size:1.15rem; margin-left:6px; }
  .hud .stat .amber { color:var(--term-amber); }
  .stage { position:relative; }
  canvas {
    width:100%; display:block;
    background:#070b09;
    border:1px solid var(--term-green-dim);
    border-radius:10px;
    image-rendering:pixelated;
    touch-action:none;
  }
  .overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(7,11,9,.82);
    border-radius:10px;
    text-align:center;
    padding:20px;
    gap:14px;
  }
  .overlay.hidden { display:none; }
  .overlay h2 { color:var(--term-green); font-size:1.4rem; letter-spacing:1px; }
  .overlay p { color:var(--term-muted); font-size:.85rem; line-height:1.7; }
  .overlay .final { color:var(--term-amber); font-size:1rem; }
  .btn {
    background:transparent;
    color:var(--term-green);
    border:1px solid var(--term-green);
    border-radius:8px;
    padding:10px 22px;
    font-family:inherit;
    font-size:.9rem;
    font-weight:700;
    letter-spacing:1px;
    cursor:pointer;
    transition:.15s;
  }
  .btn:hover { background:var(--term-green); color:#04130d; box-shadow:0 0 18px rgba(52,211,153,.4); }
  .controls { margin-top:14px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn--sm { padding:7px 16px; font-size:.8rem; }
  .hint { margin-top:16px; font-size:.78rem; color:var(--term-muted); text-align:center; line-height:1.8; }
  .hint kbd {
    background:#0d1612; border:1px solid var(--term-line); border-radius:4px;
    padding:1px 7px; color:var(--term-green); font-family:inherit; font-size:.78rem;
  }
  .dpad { display:none; margin-top:16px; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px); gap:6px; justify-content:center; }
  .dpad button {
    background:var(--term-panel); border:1px solid var(--term-green-dim); border-radius:10px;
    color:var(--term-green); font-size:1.2rem; cursor:pointer;
  }
  .dpad button:active { background:var(--term-green-dim); }
  .dpad .up { grid-column:2; grid-row:1; }
  .dpad .left { grid-column:1; grid-row:2; }
  .dpad .down { grid-column:2; grid-row:3; }
  .dpad .right { grid-column:3; grid-row:2; }
  @media (hover:none) and (pointer:coarse) { .dpad { display:grid; } }
</style>
</head>
<body>
  <div class="topbar">
    <a href="../games.html">← 游戏中心</a>
    <span class="title">TERMINAL.SNAKE</span>
    <a href="../index.html">回首页</a>
  </div>

  <div class="panel">
    <div class="hud">
      <div class="stat">SCORE<strong id="score">0</strong></div>
      <div class="stat">BEST<strong class="amber" id="best">0</strong></div>
      <div class="stat">LEVEL<strong id="level">1</strong></div>
    </div>
    <div class="stage">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">终端贪吃蛇</h2>
        <p id="ovText">吃掉数据包（绿色方块）增长，别撞墙、别咬到自己。<br>方向键 / WASD 控制，空格暂停。</p>
        <p class="final hidden" id="ovFinal"></p>
        <button class="btn" id="startBtn">开始游戏</button>
      </div>
    </div>
    <div class="controls">
      <button class="btn btn--sm" id="pauseBtn">暂停</button>
      <button class="btn btn--sm" id="restartBtn">重开</button>
    </div>
    <div class="dpad">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="down" data-dir="down">▼</button>
      <button class="right" data-dir="right">▶</button>
    </div>
    <p class="hint">
      键盘：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>，<kbd>空格</kbd> 暂停<br>
      手机：滑动屏幕或点方向键
    </p>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 20;
  const CELL = canvas.width / GRID;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovFinal = document.getElementById('ovFinal');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');

  let snake, dir, nextDir, food, score, level, speed, timer, state;
  let best = 0;
  try { best = parseInt(localStorage.getItem('terminal_snake_best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // 圆角矩形
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  // 预生成固定背景装饰（终端字符 + 光点）
  let bgDots=[];
  (function buildBg(){
    const chars=['0','1','#','>','$','{','}','/'];
    for(let i=0;i<46;i++){
      bgDots.push({
        x:Math.random()*canvas.width, y:Math.random()*canvas.height,
        ch:chars[Math.floor(Math.random()*chars.length)],
        a:0.05+Math.random()*0.13,
        dot:Math.random()<0.5
      });
    }
  })();

  function reset() {
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    level = 1;
    speed = 140;
    placeFood();
    updateHud();
  }

  function placeFood() {
    while (true) {
      const f = {x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID)};
      if (!snake.some(s => s.x===f.x && s.y===f.y)) { food = f; return; }
    }
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    bestEl.textContent = best;
  }

  function tick() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x<0 || head.x>=GRID || head.y<0 || head.y>=GRID ||
        snake.some(s => s.x===head.x && s.y===head.y)) {
      return gameOver();
    }
    snake.unshift(head);

    if (head.x===food.x && head.y===food.y) {
      score += 10;
      if (score % 50 === 0) {
        level++;
        speed = Math.max(60, speed - 14);
        restartTimer();
      }
      placeFood();
    } else {
      snake.pop();
    }
    updateHud();
    draw();
  }

  function draw() {
    // 背景渐变
    const bg=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
    bg.addColorStop(0,"#080d0a"); bg.addColorStop(1,"#060a08");
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // 棋盘格微妙变化
    ctx.fillStyle="rgba(52,211,153,.025)";
    for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
      if((r+c)%2===0) ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
    }
    // 网格线
    ctx.strokeStyle='rgba(52,211,153,0.06)';
    ctx.lineWidth=1;
    for(let i=1;i<GRID;i++){
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke();
    }
    // 背景终端字符 / 光点
    ctx.font="10px 'Space Grotesk',monospace";
    for(const b of bgDots){
      ctx.fillStyle="rgba(52,211,153,"+b.a+")";
      if(b.dot){ ctx.beginPath(); ctx.arc(b.x,b.y,1.2,0,Math.PI*2); ctx.fill(); }
      else { ctx.fillText(b.ch,b.x,b.y); }
    }
    // 扫描线
    ctx.fillStyle="rgba(52,211,153,.03)";
    const scanY=(performance.now()/18)%canvas.height;
    ctx.fillRect(0,scanY,canvas.width,2);

    // 食物：发光能量核心
    const fx=food.x*CELL+CELL/2, fy=food.y*CELL+CELL/2;
    const pulse=1+Math.sin(performance.now()/200)*0.15;
    const glow=ctx.createRadialGradient(fx,fy,1,fx,fy,CELL*0.9);
    glow.addColorStop(0,"rgba(251,191,36,.55)"); glow.addColorStop(1,"rgba(251,191,36,0)");
    ctx.fillStyle=glow;
    ctx.beginPath(); ctx.arc(fx,fy,CELL*0.9,0,Math.PI*2); ctx.fill();
    // 核心菱形
    ctx.save();
    ctx.translate(fx,fy); ctx.rotate(Math.PI/4); ctx.scale(pulse,pulse);
    ctx.fillStyle="#fbbf24";
    roundRect(-5,-5,10,10,2); ctx.fill();
    ctx.fillStyle="#fff7ed";
    ctx.fillRect(-2,-2,4,4);
    ctx.restore();
    // 四角小光点
    ctx.fillStyle="rgba(251,191,36,.8)";
    for(let i=0;i<4;i++){
      const a=i/4*Math.PI*2+performance.now()/600;
      ctx.beginPath(); ctx.arc(fx+Math.cos(a)*9,fy+Math.sin(a)*9,1.3,0,Math.PI*2); ctx.fill();
    }

    // 蛇身（从尾到头画，头最后画）
    for(let i=snake.length-1;i>=1;i--){
      const s=snake[i];
      const ratio=i/snake.length;
      const x=s.x*CELL+1.5, y=s.y*CELL+1.5, w=CELL-3;
      // 渐变身体（头亮尾暗）
      const g=ctx.createLinearGradient(x,y,x+w,y+w);
      const l=Math.round(52+ (1-ratio)*40);
      g.addColorStop(0,"#22c585");
      g.addColorStop(1,"hsl(158,64%,"+Math.max(18,34-ratio*16)+"%)");
      ctx.fillStyle=g;
      roundRect(x,y,w,w,5); ctx.fill();
      // 鳞片高光
      ctx.fillStyle="rgba(255,255,255,.14)";
      ctx.beginPath(); ctx.arc(x+w*0.35,y+w*0.32,2,0,Math.PI*2); ctx.fill();
    }

    // 蛇头
    const head=snake[0];
    const hx=head.x*CELL, hy=head.y*CELL;
    ctx.save();
    ctx.translate(hx+CELL/2,hy+CELL/2);
    // 头部发光底
    ctx.fillStyle="rgba(52,211,153,.25)";
    ctx.beginPath(); ctx.arc(0,0,CELL*0.7,0,Math.PI*2); ctx.fill();
    // 头主体
    const hg=ctx.createRadialGradient(-3,-3,2,0,0,CELL*0.6);
    hg.addColorStop(0,"#6ee7b7"); hg.addColorStop(1,"#10b981");
    ctx.fillStyle=hg;
    roundRect(-CELL/2+1,-CELL/2+1,CELL-2,CELL-2,6); ctx.fill();
    ctx.strokeStyle="#065f46"; ctx.lineWidth=1.5; ctx.stroke();
    // 眼睛（根据方向朝前）
    const dx=dir.x, dy=dir.y;
    const ex=dx*4, ey=dy*4;       // 眼睛前后偏移
    const px=-dy*4, py=dx*4;      // 垂直方向分开
    ctx.fillStyle="#ecfdf5";
    ctx.beginPath(); ctx.arc(ex+px*0.55,ey+py*0.55,3,0,Math.PI*2);
    ctx.arc(ex-px*0.55,ey-py*0.55,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#022c22";
    ctx.beginPath(); ctx.arc(ex+dx+px*0.55,ey+dy+py*0.55,1.6,0,Math.PI*2);
    ctx.arc(ex+dx-px*0.55,ey+dy-py*0.55,1.6,0,Math.PI*2); ctx.fill();
    // 吐信（朝前）
    ctx.strokeStyle="#f43f5e"; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(dx*7,dy*7);
    ctx.lineTo(dx*11,dy*11);
    ctx.moveTo(dx*11,dy*11); ctx.lineTo(dx*13+dy*2,dy*13+dx*2);
    ctx.moveTo(dx*11,dy*11); ctx.lineTo(dx*13-dy*2,dy*13-dx*2);
    ctx.stroke();
    ctx.restore();
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function start() {
    reset();
    draw();
    state = 'running';
    overlay.classList.add('hidden');
    restartTimer();
  }

  function gameOver() {
    clearInterval(timer);
    state = 'over';
    if (score > best) {
      best = score;
      try { localStorage.setItem('terminal_snake_best', String(best)); } catch (e) {}
    }
    updateHud();
    ovTitle.textContent = '连接中断';
    ovText.innerHTML = '蛇撞到了边界或自身。';
    ovFinal.textContent = '本局得分 ' + score + ' · 最高 ' + best;
    ovFinal.classList.remove('hidden');
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (state === 'running') {
      clearInterval(timer);
      state = 'paused';
      pauseBtn.textContent = '继续';
      ovTitle.textContent = '已暂停';
      ovText.innerHTML = '按空格或点击继续。';
      ovFinal.classList.add('hidden');
      startBtn.textContent = '继续游戏';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      resume();
    }
  }

  function resume() {
    state = 'running';
    pauseBtn.textContent = '暂停';
    overlay.classList.add('hidden');
    restartTimer();
  }

  function setDir(name) {
    const map = {
      up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}
    };
    const d = map[name];
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  document.addEventListener('keydown', function(e) {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()) || e.key===' ') e.preventDefault();
    if (k==='arrowup'||k==='w') setDir('up');
    else if (k==='arrowdown'||k==='s') setDir('down');
    else if (k==='arrowleft'||k==='a') setDir('left');
    else if (k==='arrowright'||k==='d') setDir('right');
    else if (e.key===' ') {
      if (state==='running'||state==='paused') togglePause();
    }
  });

  document.querySelectorAll('.dpad button').forEach(b => {
    b.addEventListener('click', () => setDir(b.dataset.dir));
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', function(e) {
    touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY};
  }, {passive:true});
  canvas.addEventListener('touchend', function(e) {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx)<18 && Math.abs(dy)<18) return;
    if (Math.abs(dx)>Math.abs(dy)) setDir(dx>0?'right':'left');
    else setDir(dy>0?'down':'up');
    touchStart = null;
  }, {passive:true});

  startBtn.addEventListener('click', function() {
    if (state==='paused') resume();
    else start();
  });
  pauseBtn.addEventListener('click', function() {
    if (state==='running'||state==='paused') togglePause();
  });
  restartBtn.addEventListener('click', start);

  reset();
  draw();
})();
</script>
</body>
</html>
